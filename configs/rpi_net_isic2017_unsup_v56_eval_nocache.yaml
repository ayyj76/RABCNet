seed: 42
output_dir: outputs/rpi_net_isic2017_unsup_v56_ega_bgdecouple_bgsup_recallrefine_headft

data:
  root: datasets/ISIC2017
  image_size: 224
  use_hair_removal: false
  use_tensor_cache: false
  tensor_cache_dir: outputs/tensor_cache/isic2017_v15_itercache
  train_split: train
  val_split: val
  test_split: test
  num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  cache_images: false
  cache_workers: 8

pseudo:
  output_dir: outputs/pseudo_labels/isic2017_train
  force_regenerate: false
  kmeans_clusters: 2
  kmeans_threads: 10
  batch_size: 8
  threshold_method: otsu
  consensus_blend: 0.20

train:
  epochs: 6
  iterative_rounds: 0
  iterative_epochs: 0
  iterative_blend: 0.35
  iterative_blend_decay: 1.0
  iterative_use_hard: false
  iterative_uncertainty_selective: true
  iterative_uncertainty_percentile: 0.8
  iterative_uncertainty_from_sigma: true
  iterative_entropy_weight: 0.6
  iterative_blend_high: 0.35
  iterative_blend_low: 0.05
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  threshold: 0.3
  use_mean_teacher: false
  ema_decay: 0.99
  consistency_weight: 0.0
  consistency_rampup_epochs: 0
  agreement_gamma: 1.0
  pseudo_consensus_weight: 0.15
  boundary_weight: 0.03
  boundary_head_weight: 0.15
  background_supervision_weight: 0.10
  uncertainty_supervision_weight: 0.08
  aux_consensus_weight: 0.05
  detail_consensus_weight: 0.08
  supervised_weight: 0.0
  labeled_ratio: 0.0
  pseudo_tversky_weight: 0.20
  pseudo_tversky_alpha: 0.65
  pseudo_tversky_beta: 0.35
  pseudo_tversky_gamma: 1.10
  supervised_tversky_weight: 0.0
  supervised_tversky_alpha: 0.65
  supervised_tversky_beta: 0.35
  supervised_tversky_gamma: 1.00
  resume_strict: false
  resume_load_optimizer: false
  resume_load_scaler: false
  resume_reset_epoch: true
  resume_reset_best: true
  freeze_segmentation_path: true
  trainable_prefixes:
    - recall_recover_refine
  freeze_bn_stats: true

model:
  hidden_dim: 128
  dropout: 0.1
  backbone: convnext_tiny
  backbone_pretrained: true
  use_boundary_head: true
  use_uncertainty_head: true
  refine_with_heads: true
  use_aspp: false
  use_aux_head: true
  use_se_context: true
  use_detail_fusion: true
  use_coord_attn: true
  use_edge_prompt: true
  use_dual_supervised_head: false
  use_eca_context: true
  use_ema_context: true
  use_cbam_decoder: true
  use_simam_refine: true
  use_safm_decoder: true
  use_uncertainty_gated_refine: true
  use_sk_context: true
  use_triplet_decoder: true
  use_msaa_fusion: true
  use_ega_refine: true
  use_bg_decouple_head: true
  use_recall_recover_refine: true

runtime:
  device: cuda
  save_every: 1000
  cpu_threads: 12
  tf32: true
  cudnn_benchmark: false
  channels_last: true
  compile: false
