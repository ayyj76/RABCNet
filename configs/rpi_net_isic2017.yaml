seed: 42
output_dir: outputs/rpi_net_isic2017

data:
  root: datasets/ISIC2017
  image_size: 224
  use_hair_removal: false
  use_tensor_cache: true
  tensor_cache_dir: outputs/tensor_cache/isic2017
  train_split: train
  val_split: val
  test_split: test
  num_workers: 0
  prefetch_factor: 4
  persistent_workers: true
  cache_images: false
  cache_workers: 8

pseudo:
  output_dir: outputs/pseudo_labels/isic2017_train
  force_regenerate: false
  kmeans_clusters: 2
  kmeans_threads: 10
  batch_size: 8
  threshold_method: otsu

train:
  epochs: 90
  iterative_rounds: 0
  iterative_epochs: 0
  iterative_blend: 0.35
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  amp: true
  grad_clip: 1.0
  threshold: 0.3

model:
  hidden_dim: 128
  dropout: 0.1

runtime:
  device: cuda
  save_every: 5
  cpu_threads: 12
  tf32: true
  channels_last: true
  compile: false
