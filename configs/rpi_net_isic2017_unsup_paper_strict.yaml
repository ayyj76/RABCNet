seed: 42
output_dir: outputs/rpi_net_isic2017_unsup_paper_strict

data:
  root: datasets/ISIC2017
  image_size: 224
  use_hair_removal: false
  use_tensor_cache: true
  tensor_cache_dir: outputs/tensor_cache/isic2017
  train_split: train
  val_split: val
  test_split: test
  num_workers: 0
  prefetch_factor: 4
  persistent_workers: true
  cache_images: false
  cache_workers: 8

pseudo:
  output_dir: outputs/pseudo_labels/isic2017_train
  force_regenerate: false
  kmeans_clusters: 2
  kmeans_threads: 10
  batch_size: 8
  threshold_method: otsu

train:
  epochs: 90
  iterative_rounds: 1
  iterative_epochs: 8
  iterative_blend: 0.35
  iterative_blend_decay: 1.0
  iterative_use_hard: false
  iterative_uncertainty_selective: false
  iterative_uncertainty_percentile: 0.8
  iterative_uncertainty_from_sigma: true
  iterative_entropy_weight: 0.6
  iterative_blend_high: 0.35
  iterative_blend_low: 0.05
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-4
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  threshold: 0.3
  use_mean_teacher: false
  ema_decay: 0.99
  consistency_weight: 0.0
  consistency_rampup_epochs: 0
  agreement_gamma: 0.0
  pseudo_consensus_weight: 0.0
  boundary_weight: 0.0
  boundary_head_weight: 0.0
  uncertainty_supervision_weight: 0.0
  aux_consensus_weight: 0.0
  detail_consensus_weight: 0.0
  supervised_weight: 0.0
  labeled_ratio: 0.0
  pseudo_tversky_weight: 0.0
  pseudo_tversky_alpha: 0.5
  pseudo_tversky_beta: 0.5
  pseudo_tversky_gamma: 1.0
  supervised_tversky_weight: 0.0
  supervised_tversky_alpha: 0.5
  supervised_tversky_beta: 0.5
  supervised_tversky_gamma: 1.0

model:
  hidden_dim: 128
  dropout: 0.1
  backbone: resnet50
  backbone_pretrained: true
  use_boundary_head: false
  use_uncertainty_head: false
  refine_with_heads: false
  use_aspp: false
  use_aux_head: false
  use_se_context: false
  use_detail_fusion: false
  use_coord_attn: false
  use_edge_prompt: false
  use_dual_supervised_head: false
  use_eca_context: false
  use_cbam_decoder: false
  use_simam_refine: false
  use_uncertainty_gated_refine: false
  use_sk_context: false
  use_triplet_decoder: false

runtime:
  device: cuda
  save_every: 5
  cpu_threads: 12
  tf32: true
  channels_last: true
  compile: false
